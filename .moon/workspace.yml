$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Projects in this monorepo. Paths are relative to the workspace root.
projects:
  services: 'services'
  client-detection: 'client-object-detection'
  client-retrieval: 'client-image-retrieval'
  retrieval-search: 'image-retrieval-search'

vcs:
  client: 'git'
  defaultBranch: 'main'
