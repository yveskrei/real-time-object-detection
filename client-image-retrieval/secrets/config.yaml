local: true

sources_config:
  ids: [1]
  default:
    inf_frame: 25
    conf_threshold: 0.25
    nms_iou_threshold: 0.5

elastic_config:
  url: http://localhost:9200
  index_name: embeddings-live

triton_config:
  url: http://localhost:8001

inference_config:
  device_type: CPU
  instances:
    default: 1
    custom:
      CPU:
        FrameDetection: 1
        FrameEmbedding: 1
        BBOXEmbedding: 1

  models:
    FrameDetection:
      name: yolo26x
      model_type: YOLO26
      precision: FP32
      input_name: images
      input_shape: [3, 640, 640]
      output_name: output
      output_shape: [300, 6]
      batch_max_size: 16
      batch_max_queue_delay: 2500
      batch_preferred_sizes: [2,4,6,8]

    FrameEmbedding:
      name: dinov3-512
      model_type: DINOV3
      precision: FP16
      input_name: images
      input_shape: [3, 512, 512]
      output_name: output
      output_shape: [768]
      batch_max_size: 16
      batch_max_queue_delay: 1000
      batch_preferred_sizes: [4, 8, 16]

    BBOXEmbedding:
      name: dinov3-224
      model_type: DINOV3
      precision: FP16
      input_name: images
      input_shape: [3, 224, 224]
      output_name: output
      output_shape: [768]
      batch_max_size: 16
      batch_max_queue_delay: 1000
      batch_preferred_sizes: [4, 8, 16]
