$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'client-detection'
layer: 'application'
language: 'rust'

project:
  name: 'Client Object Detection'
  description: 'Rust client that streams video frames through the Triton object detection model.'

# NOTE: unlike `services`, no task here sets `runFromWorkspaceRoot`. The default
# working directory (this crate) is required: `AppConfig::load_config_file`
# reads "secrets/config.yaml" and `ClientVideo::new` loads
# "secrets/libclient_video.so", both relative to the process CWD.
#
# Startup ordering is handled entirely by the `services:triton-*` deps. Those tasks
# run `docker compose up --wait` and only exit once the compose healthcheck reports
# Triton as serving, so by the time cargo runs the server is up. `InferenceModel::new`
# calls `server_ready()` and bails if it is not, which is what this ordering prevents.
#
# `DEVICE_TYPE` is what these tasks actually switch. The client is what uploads the
# model configuration to Triton (tensorrt_plan/model.plan/KIND_GPU vs
# onnxruntime_onnx/model.onnx/KIND_CPU), and the same variable also selects each
# model's default precision - FP32 on CPU, FP16 on GPU - which a model can override by
# declaring `precision` in secrets/config.yaml. It is required and has no default, so a
# bare `cargo run` must export it.
tasks:
  cpu:
    command: 'cargo run --release'
    deps:
      - 'services:triton-cpu'
    preset: 'server'
    # The client filters with `EnvFilter::from_default_env()`, which produces a
    # filter with no directives when RUST_LOG is unset - i.e. total silence.
    env:
      RUST_LOG: 'INFO'
      DEVICE_TYPE: 'CPU'

  gpu:
    command: 'cargo run --release'
    deps:
      - 'services:triton-gpu'
    preset: 'server'
    env:
      RUST_LOG: 'INFO'
      DEVICE_TYPE: 'GPU'
